<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: phone-first work tool. Dark ink header, sticky sub-tabs, ruled work-sheet rows, fixed bottom nav with a live total strip. */
:root{
  --bg:#edefec; --surface:#ffffff; --sunk:#f4f5f2; --raise:#fafbf9;
  --ink:#141d24; --muted:#5b6671; --faint:#8a949c; --line:#d8ddd6; --line2:#e7eae4;
  --brand:#10313d; --brand-2:#1b4a5a; --brand-ink:#ffffff;
  --accent:#ffc01e; --accent-ink:#141d24; --accent-soft:#fff4cf;
  --warn:#8f4600; --warn-bg:#fff1d6; --bad:#b42318; --bad-bg:#fdeae7; --good:#11724a; --good-bg:#e1f3e9; --info:#1d5b8f; --info-bg:#e5eff8;
  --f-display:"Rubik","IBM Plex Sans Hebrew",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Hebrew","Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:12px; --nav-h:62px;
  --shadow:0 1px 2px rgba(16,49,61,.06),0 4px 14px rgba(16,49,61,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1418; --surface:#172027; --sunk:#121a20; --raise:#1b252d;
  --ink:#e8edf0; --muted:#9ba7b1; --faint:#6f7b85; --line:#28343d; --line2:#212c34;
  --brand:#0b2530; --brand-2:#164050; --brand-ink:#ffffff;
  --accent:#ffc01e; --accent-ink:#141d24; --accent-soft:#3a3013;
  --warn:#f6b453; --warn-bg:#33270f; --bad:#ff8f84; --bad-bg:#3b1b18; --good:#62d6a0; --good-bg:#102e20; --info:#8cc4f2; --info-bg:#132a3d;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1418; --surface:#172027; --sunk:#121a20; --raise:#1b252d;
  --ink:#e8edf0; --muted:#9ba7b1; --faint:#6f7b85; --line:#28343d; --line2:#212c34;
  --brand:#0b2530; --brand-2:#164050; --brand-ink:#ffffff;
  --accent:#ffc01e; --accent-ink:#141d24; --accent-soft:#3a3013;
  --warn:#f6b453; --warn-bg:#33270f; --bad:#ff8f84; --bad-bg:#3b1b18; --good:#62d6a0; --good-bg:#102e20; --info:#8cc4f2; --info-bg:#132a3d;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;direction:rtl;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:780px;margin:0 auto;padding-block:4px calc(var(--nav-h) + 110px)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.1px}
.num,input.n{font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
a{color:var(--info)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--brand);color:var(--brand-ink)}
.top-in{max-width:780px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:11px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:17px;flex:none}
.logo h1{font-size:17px;font-weight:700;line-height:1.15}
.logo small{display:block;font-size:12px;opacity:.7;font-weight:400;font-family:var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save{font-size:12px;opacity:.85;white-space:nowrap;display:flex;align-items:center;gap:5px}
.save .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.save.okk .dot{background:#4fd18b}

/* sub tabs (quote steps) */
.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:7;background:var(--bg);border-bottom:1px solid var(--line)}
.steps-in{max-width:780px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.steps button{flex:1 0 auto;border:0;background:transparent;padding:11px 10px 10px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;display:flex;align-items:center;justify-content:center;gap:6px}
.steps button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.steps .cnt{font-size:11px;background:var(--ink);color:var(--bg);border-radius:999px;padding:0 6px;line-height:17px}
.steps .cnt.w{background:var(--warn)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:780px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:8px 4px 9px;font-size:11.5px;font-weight:600;color:var(--faint);min-height:var(--nav-h)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] svg{color:var(--brand-2)}
.totbar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:9;background:var(--brand);color:var(--brand-ink)}
.totbar-in{max-width:780px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:9px}
.totbar .t{display:grid;line-height:1.15;min-width:0}
.totbar .t small{opacity:.75;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.totbar .t b{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}

/* blocks */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:14px;box-shadow:var(--shadow)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line2)}
.sec-h h2{font-size:16px;font-weight:700}
.sec-h .sub{font-size:12.5px;color:var(--muted)}
.sec-b{padding:13px 14px;display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
input[type=text],input[type=tel],input[type=date],input[type=search],select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-width:0}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{min-height:72px;resize:vertical}
input.bad{border-color:var(--bad);background:var(--bad-bg)}
input.n{text-align:left;direction:ltr}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--brand-2);color:#fff;border-color:var(--brand-2)}
.lbl{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:5px}

.note.bad{background:var(--bad-bg);color:var(--bad)}

.note.info{background:var(--info-bg);color:var(--info)}
.note.plain{background:var(--sunk);color:var(--muted);border:1px dashed var(--line)}
.note b{font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.badge{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;border-radius:5px;padding:1px 7px;white-space:nowrap}
.badge.bad{background:var(--bad-bg);color:var(--bad)} .badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.info{background:var(--info-bg);color:var(--info)} .badge.good{background:var(--good-bg);color:var(--good)} .badge.plain{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}

/* home */

.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px}

.stat b{font-family:var(--f-display);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}

.st-נשלחה{background:var(--info-bg);color:var(--info)}

.st-בוצעה{background:var(--accent-soft);color:var(--warn)}

/* lines */
.line{padding:12px 14px;border-top:1px solid var(--line2);display:grid;gap:8px}

.line-h .tot{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.line-h .tot.miss{color:var(--warn);font-family:var(--f-body);font-size:13px;font-weight:600}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.rg{font-size:12.5px;color:var(--muted)}
.inrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{display:grid;gap:3px;min-width:0}
.fld>span{font-size:12px;color:var(--muted);font-weight:500}
.fld .wi{display:flex;gap:6px}
.fld .wi input{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--sunk);border-radius:9px;width:42px;min-width:42px;display:grid;place-items:center}

.qbtns button{border:1px solid var(--line);background:var(--sunk);border-radius:7px;font-size:12.5px;padding:4px 9px;font-weight:500;font-variant-numeric:tabular-nums}

.lmore{display:flex;gap:12px;flex-wrap:wrap}
.link{border:0;background:transparent;color:var(--info);font-size:13px;font-weight:600;padding:2px 0}

/* catalog browser */
.search{position:relative}
.search input{padding-inline-start:36px}

details.trade{border-top:1px solid var(--line2)}

details.trade>summary::-webkit-details-marker{display:none}
details.trade>summary .c{font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:13px}
details.trade>summary::after{content:"";width:8px;height:8px;border-inline-start:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);margin-inline-start:6px;transition:transform .15s}
details.trade[open]>summary::after{transform:rotate(135deg)}
.crow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:9px 14px;border-top:1px dashed var(--line2)}
.crow .nm{font-weight:500;font-size:14.5px}
.crow .rg{grid-column:1}
.addb{border:1px solid var(--brand-2);color:var(--brand-2);background:transparent;border-radius:8px;padding:5px 11px;font-size:13px;font-weight:700;white-space:nowrap}

:root[data-theme="dark"] .addb,:root:not([data-theme="light"]) .addb{}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .addb{color:var(--info);border-color:var(--info)}}
:root[data-theme="dark"] .addb{color:var(--info);border-color:var(--info)}

/* summary */
.sumtab{width:100%;border-collapse:collapse}
.sumtab td{padding:8px 0;border-bottom:1px solid var(--line2)}

.pay{display:grid;grid-template-columns:1fr 80px auto 30px;gap:8px;align-items:center}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}

.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;inset-inline-start:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1}
.ph.add{display:grid;place-items:center;border:2px dashed var(--line);color:var(--muted);font-size:12.5px;font-weight:600;text-align:center;cursor:pointer}
.ph.add svg{width:24px;height:24px;margin:0 auto 2px;display:block}
.aicard{border:1px solid color-mix(in srgb,var(--accent) 60%,var(--line));background:linear-gradient(180deg,var(--accent-soft),var(--surface) 70%)}
.sug{display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;align-items:start;padding:11px 14px;border-top:1px solid var(--line2)}
.sug input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--brand-2)}
.sug .nm{font-weight:600}
.sug .why{grid-column:2/-1;font-size:12.5px;color:var(--muted)}
.sug .q{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;text-align:left}
.spinner{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand-2);animation:sp 0.8s linear infinite;display:inline-block;vertical-align:-4px}
@keyframes sp{to{transform:rotate(360deg)}}

/* sheets */
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,20,26,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:780px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-h{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:14px 10px;border-bottom:1px solid var(--line);z-index:2}
.sheet-h h2{font-size:18px}
.sheet .body{display:grid;gap:12px;padding-block:12px}
.mrow{display:grid;grid-template-columns:1.3fr 1fr 1fr .8fr 34px;gap:6px;align-items:end}
.mrow.lin{grid-template-columns:1.6fr 1fr .8fr 34px}
.mrow .fld>span{font-size:11.5px}
.mrow input{padding:8px 8px}
.mres{background:var(--brand);color:#fff;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.mres b{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.mres small{opacity:.8;font-size:12.5px;display:block}

.full-bar{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);z-index:2}
.full-bar .in{max-width:820px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding-block:10px}
.paper-wrap{padding:16px max(10px,env(safe-area-inset-left,0px)) 40px max(10px,env(safe-area-inset-right,0px))}
.toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;max-width:90vw;text-align:center;box-shadow:var(--shadow)}
.tscroll{overflow-x:auto}
table.pl{width:100%;border-collapse:collapse;font-size:14px}
table.pl th{background:var(--sunk);text-align:right;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
table.pl td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
table.pl input{font-size:15px;padding:6px 8px;max-width:110px}
@media (max-width:560px){table.pl .hide-s{display:none}}
.tplcard{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line2)}
.tplcard:first-child{border-top:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* accessibility modes */
.skip-link{position:fixed;top:-60px;inset-inline-start:12px;z-index:300;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:8px;font-weight:700;text-decoration:none}
.skip-link:focus{top:calc(10px + env(safe-area-inset-top,0px))}
.a11yb{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;border-radius:9px;min-width:38px;height:38px;display:grid;place-items:center;flex:none}

.topr{display:flex;align-items:center;gap:10px}
html.a11y-t1 body{zoom:1.15} html.a11y-t2 body{zoom:1.3}

/* =====================================================================
   CALCULATION (pure, tested)
   ===================================================================== */
function calc(q, opts){
  const exempt = opts&&("exempt" in opts) ? opts.exempt : S.settings.vatExempt;
  const rate = exempt ? 0 : vatRate();
  const lines=[], errors=[], noQty=[];
  for(const l of q.lines){
    const qty=num(l.qty), price=num(l.price), cost=num(l.cost);
    const nm=l.name||"סעיף";
    if(badNum(l.qty)) errors.push(`כמות לא תקינה: ${nm}`);
    if(badNum(l.price)) errors.push(`מחיר לא תקין: ${nm}`);
    if(badNum(l.cost)) errors.push(`עלות לא תקינה: ${nm}`);
    if(!(ok(qty)&&qty>0)){ if(!badNum(l.qty)) noQty.push(l); continue; }
    if(!String(l.name||"").trim()) errors.push("לסעיף נוסף חסר תיאור");
    const it = l.ref ? item(l.ref) : null;
    lines.push({l, key:l.id, cat:l.cat, name:nm, unit:l.unit, qty, price: ok(price)?price:null, cost: ok(cost)?cost:null,
      total: ok(price)? r2(qty*price) : null, range: preRange(it), flag:l.flag, est:!!l.est, desc:l.desc||""});
  }
  const missing = lines.filter(x=>x.price===null);
  const unconfirmed = lines.filter(x=>x.est);
  const subtotal = r2(lines.reduce((a,x)=>a+(x.total||0),0));
  const sp=num(q.surcharge), dc=num(q.discount);
  if(badNum(q.surcharge)) errors.push("אחוז תוספת לא תקין");
  if(badNum(q.discount)) errors.push("הנחה לא תקינה");
  const surcharge = ok(sp)? r2(subtotal*sp/100) : 0;
  let discount = 0;
  if(ok(dc)) discount = q.discountType==="%" ? r2((subtotal+surcharge)*dc/100) : dc;
  if(q.discountType==="%" && ok(dc) && dc>100) errors.push("הנחה מעל 100%");
  if(discount > subtotal+surcharge && lines.length) errors.push("ההנחה גדולה מסכום ההצעה");
  const base = r2(subtotal+surcharge-discount);
  const mc = num(S.settings.minCharge);
  const minAdj = (ok(mc) && mc>0 && lines.length && base>=0 && base<mc) ? r2(mc-base) : 0;
  const net = r2(base+minAdj);
  const vat = r2(net*rate/100);
  const total = r2(net+vat);
  // ranges (reference only)
  let rlo=0, rhi=0, rN=0, rUnk=false;
  lines.forEach(x=>{ if(x.range){ rlo+=x.qty*x.range.lo; rhi+=x.qty*x.range.hi; rN++; if(x.range.vat==="unk") rUnk=true; } });
  const outside = lines.filter(x=>x.range && x.price!==null && (x.price < x.range.lo*0.995 || x.price > x.range.hi*1.005));
  // internal cost & profit (before VAT)
  const costLines = lines.filter(x=>x.cost!==null);
  const cost = r2(costLines.reduce((a,x)=>a+x.qty*x.cost,0));
  const profit = r2(net - cost);
  const margin = net>0 ? profit/net*100 : 0;
  // payments
  let paySum=0; const pays=(q.payments||[]).map(p=>{ const pct=num(p.pct); if(badNum(p.pct)) errors.push(`אחוז תשלום לא תקין: ${p.name||""}`); const v=ok(pct)?pct:0; paySum+=v; return {name:p.name, pct:v, amount:r2(total*v/100)}; });
  if(pays.length && Math.abs(paySum-100)>0.01 && lines.length) errors.push(`שלבי התשלום מסתכמים ב-${nf.format(paySum)}% ולא ב-100%`);
  const flags=[...new Set(lines.map(x=>x.flag).filter(Boolean))];
  const blocked = missing.length>0 || errors.length>0 || unconfirmed.length>0 || lines.length===0;
  return {lines, missing, unconfirmed, noQty, errors, subtotal, surcharge, sp:ok(sp)?sp:0, discount, minAdj, net, vat, rate, total,
    rlo, rhi, rN, rUnk, outside, cost, costN:costLines.length, profit, margin, pays, paySum, flags, blocked};
}
function measResult(m){
  if(!m) return null;
  let s=0;
  for(const r of m.rows){
    const a=num(r.a), b=num(r.b), n=num(r.n===""?1:r.n);
    if(m.mode==="area"){ if(!ok(a)||!ok(b)) continue; s += (r.minus?-1:1)*a*b*(ok(n)?n:1); }
    else { if(!ok(a)) continue; s += (r.minus?-1:1)*a*(ok(n)?n:1); }
  }
  const w=num(m.waste); const k = ok(w)? 1+w/100 : 1;
  return {raw:r2(s), total:r2(s*k), waste: ok(w)?w:0};
}

  S.cats=[...clone(DEF_CATS),...userCats];
  if(Array.isArray(profile.catalog)){
    const old=new Map(profile.catalog.map(i=>[i.id,i]));
    const merged=clone(DEF_CATALOG).map(d=>{ const o=old.get(d.id); if(!o) return d;
      const keep={myPrice:o.myPrice, myCost:o.myCost};
      if(o.edited) return Object.assign(d,{name:o.name,unit:o.unit,lo:o.lo,hi:o.hi,src:o.src,note:o.note,edited:true},keep);
      return Object.assign(d,keep); });

function saveProfile(){
  queueWrite("profile", async()=>{
    const data={catalogVersion:CATALOG_VERSION, settings:S.settings, cats:S.cats, catalog:S.catalog, templates:S.templates, hidden:S.hidden||[]};
    if(P.mode==="cloud") await profRef().set(clone(data));
    else if(P.mode==="local") localStorage.setItem("bq_profile",JSON.stringify(data));
  });
}
function saveQuote(q){
  q.updated=Date.now();
  queueWrite("q_"+q.id, async()=>{
    if(P.mode==="cloud") await profRef().collection("quotes").doc(q.id).set(clone(q));
    else if(P.mode==="local") localStorage.setItem("bq_quotes",JSON.stringify(S.quotes));
  });
}
async function deleteQuote(id){
  const q=S.quotes[id]; delete S.quotes[id]; if(S.curId===id) S.curId=null;
  try{
    if(P.mode==="cloud") await profRef().collection("quotes").doc(id).delete();
    else if(P.mode==="local") localStorage.setItem("bq_quotes",JSON.stringify(S.quotes));
    if(q && P.assets) for(const ph of (q.photos||[])) if(ph.id) P.assets.delete(ph.id).catch(()=>{});
    setSave("נמחק",true);
  }catch(e){ setSave("המחיקה נכשלה"); }
}

function go(view, step){
  if(view==="quote" && !cur()){ const last=Object.values(S.quotes).sort((a,b)=>b.updated-a.updated)[0]; if(last) S.curId=last.id; }
  S.view=view; if(step) S.step=step; S.editItem=null; S.confirm=null; render(); window.scrollTo(0,0);
}
function render(){
  document.querySelectorAll(".nav button").forEach(b=>b.setAttribute("aria-current", b.dataset.view===S.view?"page":"false"));
  const s=S.settings; $("#bizName").textContent = s.biz ? s.biz : "שיפוצים · גגות · איטום";
  $("#mark").textContent = (s.biz||"ה").trim().charAt(0).toUpperCase() || "ה";
  if(S.view==="quote" && !cur()) S.view="home";
  $("#app").innerHTML = S.view==="home"?vHome(): S.view==="quote"?vQuote(): S.view==="prices"?vPrices(): vSettings();
  renderSteps(); renderBar(); renderSheet(); hydratePhotos();
}
function storageNote(){
  if(P.mode==="none") return `<div class="note warn" style="margin-top:14px"><b>הדפדפן חוסם שמירה.</b> בדפדפן פרטי לא נשמר כלום. פתח בדפדפן רגיל או מהאייקון במסך הבית.</div>`;
  return "";
}
function backupNote(){
  const n=Object.keys(S.quotes).length; if(!n) return "";
  const last=S.settings.lastBackup; const days = last? Math.floor((Date.now()-last)/864e5) : null;
  if(days!==null && days<14) return "";
  return `<div class="note info" style="margin-top:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><span>${days===null?"עוד לא עשית גיבוי.":`הגיבוי האחרון לפני ${days} ימים.`} הנתונים שמורים רק בטלפון הזה.</span><button class="btn sm dark" data-act="export">הורד גיבוי</button></div>`;
}

function renderSteps(){
  const h=$("#stepsHost");
  if(S.view!=="quote"||!cur()){ h.innerHTML=""; return; }
  const c=calc(cur());
  const warn = c.missing.length+c.unconfirmed.length+c.errors.length;
  const st=[["details","פרטים",""],["items","כמויות",c.lines.length?`<span class="cnt">${c.lines.length}</span>`:""],["terms","תנאים",""],["summary","סיכום",warn?`<span class="cnt w">${warn}</span>`:""]];
  h.innerHTML=`<div class="steps gut"><div class="steps-in">${st.map(([k,t,x])=>`<button data-step="${k}" aria-current="${S.step===k?"page":"false"}">${t}${x}</button>`).join("")}</div></div>`;
}
function seg(path, options, val, labels){
  return `<div class="seg">${options.map((o,i)=>`<button type="button" data-seg="${path}" data-val="${esc(o)}" aria-pressed="${String(o)===String(val)}">${esc(labels?labels[i]:o)}</button>`).join("")}</div>`;
}
function vQuote(){

function siteReminders(q){
  const r=[], st=q.site, c=calc(q);
  if(st.leak==="כן") r.push("נזילה: אל תתחייב לתיקון לפני שאיתרת את מקור חדירת המים. כתם רטיבות בתקרה יכול להיות רחוק ממקור הנזילה.");
  if(st.floors!=="1" || st.access==="נדרשת עבודה בגובה" || c.flags.includes("height")) r.push("עבודה בגובה: ודא שיש ציוד והכשרה מתאימים. אל תעלה לגג מסוכן בלי אמצעי בטיחות.");
  if(st.elevator==="אין" && st.floors!=="1") r.push("אין מעלית: שקול סעיף להובלת חומרים ופסולת במדרגות.");
  if(st.parking==="אין") r.push("אין חניה לפריקה: קח בחשבון זמן ועלות לפריקה ולמכולה.");
  if(st.occupied==="כן") r.push("נכס מאוכלס: שקול סעיף להגנה על ריצוף ורהיטים ולניקיון יומי.");
  if(c.flags.includes("eng")) r.push("עבודה מבנית: נדרשים בדיקה ותכנון של מהנדס. ההערכה כאן לא מחליפה תכנון מקצועי.");
  if(c.flags.includes("elec")) r.push("חשמל: העבודה תבוצע על ידי חשמלאי בעל רישיון מתאים.");
  if(c.flags.includes("gas")) r.push("גז: העבודה תבוצע על ידי טכנאי גז מוסמך בלבד.");
  return r;
}

function lineHtml(l){

  const fl = l.flag && FLAGS[l.flag] ? `<span class="badge ${FLAGS[l.flag].cls}">${FLAGS[l.flag].label}</span>` : "";

    : `<div class="nm" style="display:grid;gap:6px;width:100%"><input type="text" id="ln_${l.id}" data-l="name:${l.id}" value="${esc(l.name)}" placeholder="תיאור הסעיף"><select id="lu_${l.id}" data-l="unit:${l.id}" style="max-width:150px">${UNITS.map(u=>`<option ${u===l.unit?"selected":""}>${esc(u)}</option>`).join("")}</select></div>`;
  let qb="";
  const myP = it && ok(num(it.myPrice)) ? num(it.myPrice) : null;
  if(r||myP!==null){
    const b=[];
    if(myP!==null) b.push(`<button type="button" data-act="fill" data-id="${l.id}" data-w="my" class="${price===myP?"on":""}">שלי ${nf.format(myP)}</button>`);
    if(r){ const lo=Math.round(r.lo), hi=Math.round(r.hi), mid=Math.round((r.lo+r.hi)/2);
      b.push(`<button type="button" data-act="fill" data-id="${l.id}" data-w="lo" class="${price===lo?"on":""}">נמוך ${nf0.format(lo)}</button>`);
      if(lo!==hi) b.push(`<button type="button" data-act="fill" data-id="${l.id}" data-w="mid" class="${price===mid?"on":""}">אמצע ${nf0.format(mid)}</button>`,`<button type="button" data-act="fill" data-id="${l.id}" data-w="hi" class="${price===hi?"on":""}">גבוה ${nf0.format(hi)}</button>`); }

  return `<div class="line" data-line="${l.id}">

      <label class="fld"><span>מחיר ליח׳, לפני מע״מ</span><input type="text" class="n" inputmode="decimal" id="lp_${l.id}" data-l="price:${l.id}" value="${esc(l.price)}" placeholder="${r||myP!==null?"בחר או הזן":"הזן מחיר"}"></label>

function suggestForgotten(q){
  const refs=new Set(q.lines.map(l=>l.ref)); const cats=new Set(q.lines.map(l=>l.cat)); const out=[];
  const add=id=>{ const it=item(id); if(it && !refs.has(id) && !out.includes(it)) out.push(it); };
  if(!q.lines.length) return [];
  if(cats.has("demo")||cats.has("floor")||cats.has("tiles")||cats.has("seal")) { add("e4"); }
  if(cats.has("demo")||cats.has("floor")) { add("e6"); }
  if(q.site.occupied==="כן"||cats.has("paint")||cats.has("floor")||cats.has("gyp")) add("e7");
  if(q.site.elevator==="אין"&&q.site.floors!=="1") add("e3");
  if(q.site.floors!=="1"||q.site.access==="נדרשת עבודה בגובה") add("e2");
  if(q.site.leak==="כן") add("l1");
  if(cats.has("floor")) add("f10");
  if(cats.has("gyp")) add("p3");
  add("e5");
  return out.slice(0,6);
}

function quoteDoc(q,c,standalone){
  const s=S.settings, unit=q.showUnitPrices!==false;
  const byCat={}; c.lines.forEach(x=>{ (byCat[x.cat]=byCat[x.cat]||[]).push(x); });
  const order=[...S.cats.map(x=>x.id),"custom"].filter(id=>byCat[id]);
  let n=0;
  const cols = unit?5:3;

    const ls=byCat[id]; const sub=ls.reduce((a,x)=>a+(x.total||0),0);
    return `<tr class="g"><td colspan="${cols}">${esc(catName(id))}</td></tr>` + ls.map(x=>`<tr><td>${++n}</td><td>${esc(x.name)}${x.flag?" *":""}${x.desc?`<div class="ds">${esc(x.desc).replace(/\n/g,"<br>")}</div>`:""}</td><td class="nm">${nf.format(x.qty)} ${esc(x.unit)}</td>${unit?`<td class="nm">${money(x.price)}</td><td class="nm">${money(x.total)}</td>`:""}</tr>`).join("")
      + `<tr class="st"><td colspan="${cols-1}">סה״כ ${esc(catName(id))}</td><td class="nm">${money(sub)}</td></tr>`;
  }).join("");
  const tot=[`<tr><td>סה״כ עבודות</td><td class="nm">${money(c.subtotal)}</td></tr>`];
  if(c.surcharge) tot.push(`<tr><td>תוספת גובה / נגישות</td><td class="nm">${money(c.surcharge)}</td></tr>`);
  if(c.discount) tot.push(`<tr><td>הנחה</td><td class="nm">−${money(c.discount)}</td></tr>`);
  if(c.minAdj) tot.push(`<tr><td>השלמה למחיר מינימום לעבודה</td><td class="nm">${money(c.minAdj)}</td></tr>`);
  tot.push(`<tr><td>סה״כ לפני מע״מ</td><td class="nm">${money(c.net)}</td></tr>`);
  tot.push(s.vatExempt?`<tr><td>עוסק פטור, לא חל מע״מ</td><td class="nm">—</td></tr>`:`<tr><td>מע״מ ${nf.format(c.rate)}%</td><td class="nm">${money(c.vat)}</td></tr>`);
  tot.push(`<tr class="T"><td>סה״כ לתשלום</td><td class="nm">${money(c.total)}</td></tr>`);
  const term=(t,v)=> v&&String(v).trim()? `<div class="tm"><b>${t}:</b> ${esc(v).replace(/\n/g,"<br>")}</div>`:"";
  const valid = pos(q.validity) ? addDays(q.date, num(q.validity)) : null;
  const pays = c.pays.filter(p=>p.pct>0);
  const flagNotes = c.flags.map(f=>FLAGS[f]&&FLAGS[f].doc).filter(Boolean);
  const css=`.paper{direction:rtl;max-width:800px;margin:0 auto;background:#fff;color:#141d24;font-family:"IBM Plex Sans Hebrew","Rubik",Arial,sans-serif;font-size:14px;line-height:1.55;padding:30px 28px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.12)}

  .paper .rule{height:4px;background:linear-gradient(90deg,#ffc01e 0 30%,#10313d 30% 100%);border-radius:2px;margin:14px 0 16px}
  .paper .cl{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;background:#f4f5f2;border-radius:8px;padding:12px 14px}
  .paper .sx{font:700 15px Rubik,Arial,sans-serif;color:#10313d;margin:18px 0 6px}
  .paper .tw{overflow-x:auto}
  .paper table{width:100%;border-collapse:collapse}
  .paper .it th{background:#10313d;color:#fff;font-weight:600;font-size:12.5px;padding:8px;text-align:right}
  .paper .it td{padding:8px;border-bottom:1px solid #e1e5de;vertical-align:top}
  .paper .it tr.g td{background:#eef1ec;font-weight:700;font-size:13px;color:#10313d}
  .paper .it tr.st td{font-size:12.5px;color:#55606a;border-bottom:2px solid #d5dad2}

  .paper .tt td{padding:6px 0;border-bottom:1px solid #e1e5de}
  .paper .tt tr.T td{font:700 19px Rubik,Arial,sans-serif;border-bottom:3px double #10313d;color:#10313d;padding-top:10px}
  .paper .pays td{padding:6px 8px;border-bottom:1px solid #e1e5de}
  .paper .tm{margin-top:6px}
  .paper .disc{margin-top:16px;font-size:12px;color:#55606a;border-top:1px solid #e1e5de;padding-top:10px}
  .paper .sig{margin-top:34px;display:grid;grid-template-columns:1fr 1fr;gap:24px;font-size:13px}

  @media (max-width:540px){.paper{padding:18px 14px;font-size:13px}.paper .it{font-size:12.5px}.paper .it th,.paper .it td{padding:6px 4px}.paper .it td.nm:nth-child(3){white-space:normal}.paper .cl{grid-template-columns:1fr}.paper .qn{text-align:right}}`;

    ${pays.length?`<div class="sx">שלבי תשלום</div><table class="pays">${pays.map(p=>`<tr><td>${esc(p.name||"")}</td><td class="nm">${nf.format(p.pct)}%</td><td class="nm">${money(p.amount)}</td></tr>`).join("")}</table>${q.payment?`<div class="tm">${esc(q.payment)}</div>`:""}`:(q.payment?term("תנאי תשלום",q.payment):"")}

    <div class="disc">הכמויות מבוססות על מדידה ובדיקה בשטח ועשויות להשתנות בזמן הביצוע. שינוי בכמויות יתומחר לפי המחירים ליחידה שבהצעה. ההצעה תחייב את הצדדים רק לאחר אישור הלקוח בכתב ובתוך תקופת התוקף שלה.${flagNotes.length?"<br>* "+flagNotes.map(esc).join("<br>* "):""}</div>

}
function quoteText(q,c){
  const s=S.settings, L=[];
  L.push(`*הצעת מחיר מס' ${q.num}${s.biz?" – "+s.biz:""}*`);
  L.push(`תאריך: ${dHe(q.date)}`);
  if(q.client.name) L.push(`לכבוד: ${q.client.name}`);
  const ad=[q.client.address,q.client.city].filter(Boolean).join(", "); if(ad) L.push(`כתובת: ${ad}`);
  if(q.title) L.push(`הנדון: ${q.title}`);
  if(q.desc) L.push("", q.desc);
  const byCat={}; c.lines.forEach(x=>{ (byCat[x.cat]=byCat[x.cat]||[]).push(x); });
  let n=0;
  [...S.cats.map(x=>x.id),"custom"].filter(id=>byCat[id]).forEach(id=>{
    L.push("",`*${catName(id)}*`);

  c.flags.forEach(f=>{ if(FLAGS[f]) L.push("* "+FLAGS[f].doc); });

  if(s.phone||s.biz) L.push("",[s.owner||s.biz,s.phone].filter(Boolean).join(" · "));

async function resizeImage(file, maxSide, maxBytes){
  try{
    const bmp = await createImageBitmap(file);
    let {width:w,height:h}=bmp; const k=Math.min(1, maxSide/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
    const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(bmp,0,0,w,h);
    let qlt=0.85, blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",qlt));
    while(blob && maxBytes && blob.size>maxBytes && qlt>0.4){ qlt-=0.15; blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",qlt)); }
    return blob || file;
  }catch(e){ return file; }
}
async function addPhotos(files){
  const q=cur(); if(!q) return;
  const list=[...files].slice(0,8);
  if(!list.length) return;
  toast("מעבד צילומים…");
  q.photos=q.photos||[];
  let failed=0;
  for(const f of list){
    const blob = await resizeImage(f, 1600, P.aiImages&&P.aiImages.maxBytes ? P.aiImages.maxBytes : 3.5*1024*1024);
    const entry = {qid:q.id, blob, url:URL.createObjectURL(blob), id:null};
    S.ai.photos.push(entry);
    if(P.assets){
      try{ const r=await P.assets.upload(blob); entry.id=r.id; q.photos.push({id:r.id, at:Date.now()}); }catch(e){ failed++; }
    }
  }
  saveQuote(q); render();
  toast(failed? "חלק מהצילומים לא נשמרו בחשבון, אבל אפשר לנתח אותם עכשיו" : P.assets? "הצילומים נשמרו בהצעה" : "הצילומים מוכנים לניתוח (לא נשמרים בתצוגה הזו)");
}
async function photoBlobs(q){
  const out=[]; const max = P.aiImages ? (P.aiImages.maxCount||4) : 0;
  if(!max) return out;
  const sessById=new Map(S.ai.photos.filter(p=>p.qid===q.id&&p.id).map(p=>[p.id,p]));
  const cands=[...(q.photos||[]).filter(p=>p.id).map(p=>({id:p.id})), ...S.ai.photos.filter(p=>p.qid===q.id&&!p.id)].slice(-max);
  for(const c of cands){
    if(c.blob){ out.push(c.blob); continue; }
    const s=sessById.get(c.id); if(s){ out.push(s.blob); continue; }
    try{ const b=await IDB.get(c.id); if(b){ out.push(b); S.ai.photos.push({qid:q.id,blob:b,url:photoURL[c.id]||URL.createObjectURL(b),id:c.id}); } }catch(e){}
  }
  return out;
}

${imgs.length?`מצורפים ${imgs.length} צילומים מאתר העבודה.`:"אין צילומים, רק תיאור."}
סוג העבודה: ${q.site.type}. קומה: ${q.site.floors}. נגישות: ${q.site.access}. נזילה: ${q.site.leak}.

"""${text.slice(0,3000)}"""

מחירון הסעיפים (מזהה|שם|יחידה|תחום):
${catalogTxt}

המשימה: הצע את סעיפי העבודה הדרושים.
כללים מחייבים:
1. אל תציין מחירים בשום מקום.
2. העדף סעיף מהמחירון: החזר את המזהה שלו ב-"id". רק אם אין סעיף מתאים, החזר "id": null עם "name" ו-"unit" (אחת מ: מ"ר, מ' אורך, יח', עבודה, ביקור, חלון, חדר, קומה, יום).

6. ב-"measure" רשום מה צריך למדוד או לברר בשטח כדי לסגור את הכמויות.

החזר רק JSON בצורה הזו:
{"summary":"משפט אחד","items":[{"id":"f1","name":"","unit":"","qty":5,"source":"text","confidence":"high","basis":"2×2.5 מ'","reason":"החלפת ריצוף"}],"safety":["..."],"measure":["..."]}`;
    const res = await P.sample.json(prompt, imgs.length?{images:imgs, modelTier:"default"}:{modelTier:"default"});

  }catch(e){
    const code=e&&e.code;
    A.error = code==="bad_key"?"מפתח ה-API לא תקין או בוטל. בדוק אותו בהגדרות."
      : code==="network"?"אין חיבור לאינטרנט, או שהבקשה נחסמה. נסה שוב."
      : code==="overloaded"?"השירות עמוס כרגע. נסה שוב בעוד דקה."

      : code==="rate_limited"?"הגעת למגבלת השימוש. נסה שוב בעוד כמה דקות."
      : code==="invalid_json"?"התשובה לא התקבלה בפורמט תקין. נסה שוב."
      : code==="image_rejected"?"אחד הצילומים לא התקבל. נסה צילום אחר."
      : "הניתוח נכשל. נסה שוב.";
  }
  A.busy=false; render();
  const el=$("#aires"); if(el) el.scrollIntoView({block:"start",behavior:"smooth"});

function validateAI(r){
  const out={summary:"",items:[],safety:[],measure:[]};
  if(!r||typeof r!=="object") return out;
  out.summary=typeof r.summary==="string"?r.summary.slice(0,300):"";
  const arr=Array.isArray(r.items)?r.items:[];
  for(const x of arr.slice(0,40)){
    if(!x||typeof x!=="object") continue;
    const it = typeof x.id==="string" ? item(x.id) : null;
    const name = it? it.name : (typeof x.name==="string"? x.name.trim().slice(0,80):"");
    if(!name) continue;
    const unit = it? it.unit : (UNITS.includes(x.unit)? x.unit : "עבודה");
    let qty = typeof x.qty==="number" && isFinite(x.qty) && x.qty>0 && x.qty<100000 ? r2(x.qty) : null;
    out.items.push({ref: it?it.id:null, name, unit, cat: it?it.cat:"custom", flag: it?it.flag:"", qty,
      source: x.source==="text"?"text":"photo", confidence: ["low","medium","high"].includes(x.confidence)?x.confidence:"low",
      basis: typeof x.basis==="string"?x.basis.slice(0,120):"", reason: typeof x.reason==="string"?x.reason.slice(0,140):""});
  }
  out.safety=(Array.isArray(r.safety)?r.safety:[]).filter(s=>typeof s==="string").slice(0,6).map(s=>s.slice(0,200));
  out.measure=(Array.isArray(r.measure)?r.measure:[]).filter(s=>typeof s==="string").slice(0,8).map(s=>s.slice(0,160));
  return out;
}

function applyAI(){
  const q=cur(), R=S.ai.result; let added=0;
  R.items.forEach((x,i)=>{
    if(!S.ai.sel.has(i)) return;
    const est = x.qty!==null && x.source!=="text";
    const note = [x.basis,x.reason].filter(Boolean).join(" · ");
    if(x.ref){
      const ex=q.lines.find(l=>l.ref===x.ref);
      if(ex){ if(!ex.qty && x.qty!==null){ ex.qty=String(x.qty); ex.est=est; ex.aiNote=note; } return; }
      q.lines.push(lineFromItem(item(x.ref),{qty:x.qty!==null?String(x.qty):"", est, aiNote:note})); added++;
    } else { q.lines.push(customLine({name:x.name, unit:x.unit, qty:x.qty!==null?String(x.qty):"", est, aiNote:note})); added++; }
  });
  if(R.measure.length){ const add="למדוד/לברר: "+R.measure.join("; "); if(!q.internal.includes(add)) q.internal = (q.internal?q.internal+"\n":"")+add; }
  S.ai.result=null; S.ai.sel=new Set();
  saveQuote(q); render(); toast(`נוספו ${added} סעיפים. בדוק כמויות ומחירים.`);
}

}

document.addEventListener("click", async e=>{
  const nav=e.target.closest(".nav button"); if(nav){ if(nav.dataset.view==="quote" && !cur() && !Object.keys(S.quotes).length){ toast("עוד אין הצעה פתוחה. פתח הצעה חדשה."); return; } go(nav.dataset.view); return; }
  const st=e.target.closest("[data-step]"); if(st){ S.step=st.dataset.step; render(); window.scrollTo(0,0); return; }
  const fl=e.target.closest("[data-filter]"); if(fl){ S.filter=fl.dataset.filter; render(); return; }
  const sg=e.target.closest("[data-seg]");
  if(sg){
    const path=sg.dataset.seg, val=sg.dataset.val, q=cur();
    if(path==="settings.vatExempt"){ S.settings.vatExempt = val==="true"; saveProfile(); }
    else if(path==="settings.showCost"){ S.settings.showCost = val==="true"; saveProfile(); }
    else if(path==="settings.noSplash"){ S.settings.noSplash = val==="true"; saveProfile(); }
    else if(path==="item.flag"){ const it=item(S.editItem); if(it){ it.flag=val; it.edited=true; saveProfile(); } }
    else if(path==="meas.mode"){ S.sheet.m.mode=val; renderSheet(); return; }
    else if(path==="tplqty"){ S.sheet.keepQty = val==="yes"; renderSheet(); return; }
    else if(path==="showUnitPrices"){ q.showUnitPrices = val==="true"; saveQuote(q); }
    else if(q){ const prev = path.split(".").reduce((o,k)=>o&&o[k],q); setPath(q,path, (prev===val && path.startsWith("site.") && ["site.elevator","site.parking","site.occupied"].includes(path)) ? "" : val); if(path==="status" && val==="נשלחה" && !q.sentAt){ q.sentAt=Date.now(); if(!q.followUp) q.followUp=addDays(today(),num(S.settings.followDays)||3);} saveQuote(q); }
    render(); return;
  }
  const ax=e.target.closest("[data-a11y]");
  if(ax){ const k=ax.dataset.a11y;
    if(k==="t") A11Y.t=(A11Y.t+1)%3; else if(k==="reset") A11Y={t:0,contrast:false,links:false,noanim:false,font:false}; else A11Y[k]=!A11Y[k];
    applyA11y(); renderSheet(); const again=document.querySelector(`[data-a11y="${k}"]`); if(again) again.focus(); toast("הגדרות הנגישות עודכנו"); return; }
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id, q=cur();
  if(act==="closebg"){ if(e.target===b){ S.sheet = (S.sheet&&S.sheet.back)? {type:"terms"} : null; renderSheet(); } return; }
  if(!["del","edel","deltpl"].includes(act)) S.confirm=null;
  switch(act){
    case "new": { const n=blankQuote(); S.quotes[n.id]=n; S.curId=n.id; saveQuote(n); saveProfile(); S.ai={photos:S.ai.photos,text:"",busy:false,result:null,sel:new Set(),error:""}; go("quote","details"); break; }
    case "newphoto": { const n=blankQuote(); S.quotes[n.id]=n; S.curId=n.id; saveQuote(n); saveProfile(); S.ai={photos:S.ai.photos,text:"",busy:false,result:null,sel:new Set(),error:""}; go("quote","items"); if(P.assets) $("#photoInput").click(); break; }
    case "example": { const n=blankQuote(); n.title="דוגמה: ניקוי מרזבים ותיקון רוכבים"; n.example=true; n.client.name="לקוח לדוגמה"; n.client.address="רחוב לדוגמה 1"; n.site.type="גג"; n.site.leak="כן";
      [["g6","20"],["t3","10"],["t2","5"],["l1","1"]].forEach(([r,qt])=>n.lines.push(lineFromItem(item(r),{qty:qt})));
      S.quotes[n.id]=n; S.curId=n.id; saveQuote(n); saveProfile(); go("quote","items"); toast("הצעת דוגמה. בחר מחירים לסעיפים."); break; }
    case "tpls": S.sheet={type:"tpls"}; renderSheet(); break;
    case "usetpl": {
      const t = DEF_TEMPLATES.find(x=>x.id===id) || S.templates.find(x=>x.id===id);
      const n=blankQuote(); n.title=t.name;
      if(t.refs) t.refs.forEach(r=>{ const it=item(r); if(it) n.lines.push(lineFromItem(it)); });
      else t.lines.forEach(l=>{ const it=l.ref?item(l.ref):null; n.lines.push(it?lineFromItem(it,{qty:l.qty||"",desc:l.desc||""}):customLine({name:l.name,unit:l.unit,qty:l.qty||"",price:l.price||"",desc:l.desc||""})); });
      S.quotes[n.id]=n; S.curId=n.id; S.sheet=null; saveQuote(n); saveProfile(); go("quote","items"); toast(`נפתחה הצעה מהתבנית "${t.name}". מלא כמויות.`); break; }
    case "open": S.curId=id; S.ai={photos:S.ai.photos,text:"",busy:false,result:null,sel:new Set(),error:""}; go("quote", S.step||"items"); break;
    case "dup": { const src=S.quotes[id]; const n=clone(src); n.id=uid(); n.num=nextNum(); n.title=(src.title||"ללא שם")+" (עותק)"; n.created=Date.now(); n.date=today(); n.status="טיוטה"; n.sentAt=null; n.followUp=""; n.example=false; n.photos=[]; n.lines.forEach(l=>l.id=uid()); S.quotes[n.id]=n; saveQuote(n); saveProfile(); render(); toast("ההצעה שוכפלה"); break; }
    case "del": if(S.confirm===id){ S.confirm=null; await deleteQuote(id); render(); } else { S.confirm=id; render(); setTimeout(()=>{ if(S.confirm===id){ S.confirm=null; render(); } },4000); } break;
    case "additem": { const it=item(id); const l=lineFromItem(it); q.lines.push(l); saveQuote(q); render(); toast(`נוסף: ${it.name}`); break; }
    case "addcust": { const l=customLine(); q.lines.push(l); saveQuote(q); render(); const el=$("#ln_"+l.id); if(el){ el.focus(); el.scrollIntoView({block:"center"}); } break; }
    case "delline": q.lines=q.lines.filter(l=>l.id!==id); saveQuote(q); render(); break;
    case "dupline": { const i=q.lines.findIndex(l=>l.id===id); const n=clone(q.lines[i]); n.id=uid(); q.lines.splice(i+1,0,n); saveQuote(q); render(); break; }
    case "desc": S.descOpen.add(id); render(); { const el=$("#ld_"+id); if(el) el.focus(); } break;
    case "confirmqty": { const l=lineById(id); l.est=false; saveQuote(q); render(); break; }
    case "fill": {
      const l=lineById(id); const it=item(l.ref); const r=preRange(it); let p;
      if(b.dataset.w==="my") p=num(it.myPrice); else { p = b.dataset.w==="lo"?r.lo: b.dataset.w==="hi"?r.hi:(r.lo+r.hi)/2; p=Math.round(p); }
      l.price=String(p); const inp=$("#lp_"+id); if(inp){ inp.value=l.price; inp.classList.remove("bad"); }
      saveQuote(q); refreshNumbers(id); break; }
    case "meas": { const l=lineById(id); const mode = l.unit==="מ\"ר"?"area": l.unit==="מ' אורך"?"length":"count";
      const m = l.meas? clone(l.meas) : {mode, rows:[{l:"",a:"",b:"",n:"1",minus:false}], waste:""};
      S.sheet={type:"meas", lineId:id, m, walls:null}; renderSheet(); break; }
    case "mpreset": { const m=S.sheet.m; const p=b.dataset.p;
      if(p==="floor") m.rows.push({l:"רצפה / תקרה",a:"",b:"",n:"1",minus:false});
      if(p==="walls") S.sheet.walls={l:"",w:"",h:"2.6"};
      if(p==="door") m.rows.push({l:"דלת",a:"0.9",b:"2.1",n:"1",minus:true});
      if(p==="window") m.rows.push({l:"חלון",a:"1.2",b:"1.2",n:"1",minus:true});
      m.rows=m.rows.filter(r=>r.a!==""||r.b!==""||r.l!==""||r.minus||m.rows.length===1);
      renderSheet(); break; }
    case "wallsadd": { const w=S.sheet.walls; const L=num(w.l), W=num(w.w), H=num(w.h);
      if(!(pos(L)&&pos(W)&&pos(H))){ toast("מלא אורך, רוחב וגובה"); break; }
      S.sheet.m.rows=S.sheet.m.rows.filter(r=>r.a!==""||r.b!==""||r.l!=="");
      S.sheet.m.rows.push({l:`קירות ${nf.format(L)}×${nf.format(W)}`,a:String(r2(2*(L+W))),b:String(H),n:"1",minus:false}); S.sheet.walls=null; renderSheet(); break; }
    case "madd": S.sheet.m.rows.push({l:"",a:"",b:"",n:"1",minus:!!b.dataset.minus}); renderSheet(); break;
    case "mdel": S.sheet.m.rows.splice(+b.dataset.i,1); if(!S.sheet.m.rows.length) S.sheet.m.rows.push({l:"",a:"",b:"",n:"1",minus:false}); renderSheet(); break;
    case "muse": { const res=measResult(S.sheet.m); if(!res||res.total<=0){ toast("החישוב יצא 0. בדוק את המידות."); break; }
      const l=lineById(S.sheet.lineId); l.qty=String(res.total); l.meas=clone(S.sheet.m); l.est=false; S.sheet=null; saveQuote(q); render(); toast(`הכמות עודכנה: ${nf.format(res.total)} ${l.unit}`); break; }
    case "close": S.sheet = (S.sheet&&S.sheet.back)? {type:"terms"} : null; renderSheet(); break;
    case "a11y": S.sheet={type:"a11y"}; renderSheet(); break;
    case "legal": S.sheet={type:"legal", tab:b.dataset.tab||"terms", back: !!(b.dataset.back || (S.sheet&&S.sheet.back))}; renderSheet(); { const sh=document.querySelector(".sheet"); if(sh) sh.scrollTop=0; } break;
    case "acceptterms": { const c=$("#termsChk"); if(!c||!c.checked){ toast("סמן את תיבת האישור כדי להמשיך"); if(c) c.focus(); break; }
      try{ localStorage.setItem(TERMS_KEY, JSON.stringify({at:Date.now(), v:LEGAL_DATE})); }catch(e){}
      S.sheet=null; renderSheet(); toast("ברוך הבא"); break; }
    case "preview": S.sheet={type:"preview"}; renderSheet(); break;
    case "copytext": { const c=calc(q); const t=quoteText(q,c);
      try{ await navigator.clipboard.writeText(t); toast("ההצעה הועתקה. הדבק אותה בוואטסאפ או במייל."); }
      catch(err){ copyFallback(t); } break; }
    case "wa": { markSent(q); toast("ההצעה סומנה כנשלחה. נקבעה תזכורת לחזור ללקוח."); renderBar(); break; }
    case "download": { const c=calc(q);
      try{ await P.downloads.save({filename:`quote-${q.num}.html`, data:new Blob([quoteDoc(q,c,true)],{type:"text/html"})}); markSent(q); toast("הקובץ נשמר"); }
      catch(err){ toast(err&&err.code==="declined"?"ההורדה בוטלה":"ההורדה לא הצליחה. אפשר להעתיק את ההצעה כטקסט."); } break; }
    case "savetpl": S.sheet={type:"savetpl",keepQty:false}; renderSheet(); break;
    case "dosavetpl": { const name=($("#tplname").value||"").trim()||"תבנית"; const keep=S.sheet.keepQty;
      S.templates.push({id:"u"+uid(), name, lines:q.lines.map(l=>({ref:l.ref,name:l.name,unit:l.unit,qty:keep?l.qty:"",price:l.ref?"":l.price,desc:l.desc}))});
      S.sheet=null; saveProfile(); renderSheet(); toast(`התבנית "${name}" נשמרה`); break; }
    case "deltpl": if(S.confirm==="t_"+id){ S.templates=S.templates.filter(t=>t.id!==id); S.confirm=null; saveProfile(); render(); } else { S.confirm="t_"+id; render(); } break;
    case "addpay": q.payments.push({name:"",pct:""}); saveQuote(q); render(); break;
    case "delpay": q.payments.splice(+b.dataset.i,1); saveQuote(q); render(); break;
    case "paydefault": { if(!q){ toast("אין הצעה פתוחה"); break; } S.settings.payments=clone(q.payments); saveProfile(); render(); toast("שלבי התשלום נשמרו כברירת מחדל"); break; }
    case "delphoto": { const i=+b.dataset.i;
      if(b.dataset.kind==="sess"){ S.ai.photos.splice(i,1); }
      else { const saved=q.photos.filter(p=>p.id); const ph=saved[i]; q.photos=q.photos.filter(p=>p!==ph); S.ai.photos=S.ai.photos.filter(p=>p.id!==ph.id); if(ph&&P.assets) P.assets.delete(ph.id).catch(()=>{}); saveQuote(q); }
      render(); break; }
    case "ai": runAI(); break;
    case "aiadd": applyAI(); break;
    case "aiclear": S.ai.result=null; render(); break;
    case "edit": S.editItem=id; render(); break;
    case "edone": S.editItem=null; saveProfile(); render(); break;
    case "edel": if(S.confirm==="i_"+id){ S.catalog=S.catalog.filter(i=>i.id!==id); if(DEF_CATALOG.find(d=>d.id===id)){ S.hidden=[...(S.hidden||[]),id]; } S.editItem=null; S.confirm=null; saveProfile(); render(); } else { S.confirm="i_"+id; render(); } break;
    case "newitem": { const it={id:"u"+uid(),cat:b.dataset.cat,name:"סעיף חדש",unit:"עבודה",lo:null,hi:null,src:"",note:"",flag:"",edited:true}; S.catalog.push(it); S.editItem=it.id; S.openTrades.add("p_"+it.cat); saveProfile(); render(); const el=$("#e_nm"); if(el){ el.focus(); el.select(); } break; }
    case "addcat": { const v=($("#newcat").value||"").trim(); if(!v){ toast("רשום שם לתחום"); break; } const c={id:"c"+uid(),name:v}; S.cats.push(c); S.openTrades.add("p_"+c.id); saveProfile(); render(); toast("התחום נוסף. הוסף לו סעיפים."); break; }
    case "export": case "exportprices": { const pricesOnly = act==="exportprices";
      const settings=Object.assign({},S.settings); delete settings.apiKey;
      const data={app:"pro-quote",version:2,pricesOnly,exported:new Date().toISOString(),profile:{catalogVersion:CATALOG_VERSION,settings:pricesOnly?{}:settings,cats:S.cats,catalog:S.catalog.map(i=>{ const c=Object.assign({},i); if(pricesOnly) delete c.myCost; return c; }),templates:S.templates,hidden:S.hidden||[]},quotes:pricesOnly?{}:S.quotes};
      const fname = pricesOnly? `price-list-${today()}.json` : `quotes-backup-${today()}.json`;
      const blob=new Blob([JSON.stringify(data,null,1)],{type:"application/json"});
      try{
        const file=new File([blob],fname,{type:"application/json"});
        if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:fname}); }
        else await P.downloads.save({filename:fname, data:blob});
        if(!pricesOnly){ S.settings.lastBackup=Date.now(); saveProfile(); }
        toast(pricesOnly?"קובץ המחירון מוכן לשליחה":"הגיבוי נשמר"); render();
      }catch(err){ if(err&&err.name==="AbortError") toast("בוטל"); else toast("הקובץ לא נשמר"); } break; }
    case "goai": go("settings"); setTimeout(()=>{ const el=$("#aiSettings"); if(el) el.scrollIntoView({block:"start"}); },50); break;
    case "print": window.print(); break;
    case "sharefile": { const c=calc(q); const fname=`quote-${q.num}.html`; const file=new File([quoteDoc(q,c,true)],fname,{type:"text/html"});
      try{ await navigator.share({files:[file],title:`הצעת מחיר ${q.num}`}); markSent(q); renderBar(); }catch(err){ if(!(err&&err.name==="AbortError")) toast("השיתוף לא הצליח. אפשר להוריד את הקובץ."); } break; }
    case "doimport": { const d=S.sheet.data.raw; const mine=clone(S.settings);
      applyProfile(d.profile);
      if(d.pricesOnly) S.settings=mine; else { S.settings.apiKey=mine.apiKey||""; S.settings.aiModel=S.settings.aiModel||mine.aiModel; }
      for(const [k,v] of Object.entries(d.quotes||{})){ S.quotes[k]=migrateQuote(v); saveQuote(S.quotes[k]); }
      saveProfile(); S.sheet=null; render(); toast(d.pricesOnly?"המחירון נטען":"השחזור הושלם"); break; }
  }
});
function copyFallback(t){
  const w=$("#paperWrap")||$("#app");
  const box=document.createElement("div");
  box.innerHTML=`<div class="note info" style="max-width:800px;margin:0 auto 12px"><b>ההעתקה האוטומטית לא זמינה כאן.</b> סמן את הטקסט והעתק ידנית:<textarea id="copyfb" style="margin-top:8px;min-height:180px" readonly></textarea></div>`;
  w.prepend(box); const ta=$("#copyfb"); ta.value=t; ta.focus(); ta.select();
}
document.addEventListener("toggle", e=>{ const d=e.target; if(d.matches&&d.matches("details.trade")){ if(d.open) S.openTrades.add(d.dataset.trade); else S.openTrades.delete(d.dataset.trade); } }, true);
document.addEventListener("change", e=>{
  const el=e.target;
  if(el.id==="photoInput"){ addPhotos(el.files).finally(()=>{ el.value=""; }); return; }
  if(el.id==="importInput"){ const f=el.files[0]; el.value=""; if(!f) return; const fr=new FileReader(); fr.onload=()=>{ try{ const d=JSON.parse(fr.result); if(!d||d.app!=="pro-quote"||!d.profile) throw 0; S.sheet={type:"import",data:{raw:d,quotesN:Object.keys(d.quotes||{}).length}}; renderSheet(); }catch(err){ toast("זה לא קובץ גיבוי של האפליקציה"); } }; fr.readAsText(f); return; }
  if(el.dataset.aisel!==undefined){ const i=+el.dataset.aisel; if(el.checked) S.ai.sel.add(i); else S.ai.sel.delete(i); const btn=document.querySelector('[data-act="aiadd"]'); if(btn){ btn.textContent=`הוסף ${S.ai.sel.size} סעיפים להצעה`; btn.disabled=!S.ai.sel.size; } return; }
  if(el.tagName==="SELECT") el.dispatchEvent(new Event("input",{bubbles:true}));
});
let searchT;
document.addEventListener("input", e=>{
  const el=e.target, q=cur();
  if(el.dataset.ui==="search"){ S.search=el.value; clearTimeout(searchT); searchT=setTimeout(()=>{ const pos=el.selectionStart; render(); const n=$("#qsearch"); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(x){} } },250); return; }
  if(el.dataset.ui==="catsearch"){ S.catSearch=el.value; clearTimeout(searchT); const id=el.id; searchT=setTimeout(()=>{ const pos=el.selectionStart; render(); const n=$("#"+id); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(x){} } },250); return; }
  if(el.dataset.ui==="aitext"){ S.ai.text=el.value; return; }
  if(el.dataset.q && q){
    setPath(q, el.dataset.q, el.value); if(["surcharge","discount","validity"].includes(el.dataset.q)) markInvalid(el);
    saveQuote(q); if(["surcharge","discount","validity"].includes(el.dataset.q)) refreshNumbers(); else if(["client.name","title"].includes(el.dataset.q)) renderBar();
    return;
  }
  if(el.dataset.l && q){
    const [f,id]=el.dataset.l.split(":"); const l=lineById(id); if(!l) return;
    l[f]=el.value;
    if(["qty","price","cost"].includes(f)) markInvalid(el);
    if(f==="qty"){ l.est=false; l.meas=null; const est=el.closest(".line")&&el.closest(".line").querySelector(".est"); if(est) est.remove(); }
    saveQuote(q); if(["qty","price","cost"].includes(f)) refreshNumbers(id); else renderSteps();
    return;
  }
  if(el.dataset.pay && q){ const [f,i]=el.dataset.pay.split(":"); q.payments[+i][f]=el.value; if(f==="pct") markInvalid(el); saveQuote(q); refreshNumbers(); return; }
  if(el.dataset.cat){ const [f,id]=el.dataset.cat.split(":"); const it=item(id); if(it){ it[f]=el.value; markInvalid(el); saveProfile(); } return; }
  if(el.dataset.s){ S.settings[el.dataset.s]=el.value; if(["vat","minCharge","validity","followDays"].includes(el.dataset.s)) markInvalid(el);
    if(el.dataset.s==="biz"){ $("#bizName").textContent=el.value||"שיפוצים · גגות · איטום"; $("#mark").textContent=(el.value||"ה").trim().charAt(0).toUpperCase()||"ה"; }
    saveProfile(); return; }
  if(el.dataset.e && S.editItem){ const it=item(S.editItem), k=el.dataset.e; it.edited=true;
    if(k==="lo"||k==="hi"){ markInvalid(el); const v=num(el.value); if(el.value.trim()!=="" && ok(v)){ if(it.src){ it.src=""; it.note=""; } it[k]=v; } else if(el.value.trim()==="" && !it.src){ it[k]=null; } }
    else it[k]=el.value; saveProfile(); return; }
  if(el.dataset.m!==undefined && S.sheet && S.sheet.type==="meas"){
    const m=S.sheet.m;
    if(el.dataset.m==="waste") m.waste=el.value; else { const [f,i]=el.dataset.m.split(":"); m.rows[+i][f]=el.value; }
    if(el.classList.contains("n")) markInvalid(el);
    const res=measResult(m); const l=lineById(S.sheet.lineId); const box=$("#mres");
    if(box) box.querySelector("div").innerHTML=`<small>תוצאה</small><b>${res?nf.format(res.total):0} ${esc(l.unit)}</b><small>${res&&res.waste?`${nf.format(res.raw)} + ${nf.format(res.waste)}% פחת`:""}</small>`;
    return;
  }
  if(el.dataset.w && S.sheet && S.sheet.walls){ S.sheet.walls[el.dataset.w]=el.value; return; }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && S.sheet && S.sheet.type!=="terms"){ S.sheet = S.sheet.back? {type:"terms"} : null; renderSheet(); } });

/* =====================================================================
   BOOT
   ===================================================================== */
render();
(async()=>{ await initPlatform(); await loadAll(); render();
  let accepted=false; try{ accepted=!!localStorage.getItem(TERMS_KEY); }catch(e){ accepted=true; }
  if(!accepted){ const show=()=>{ S.sheet={type:"terms"}; renderSheet(); }; const sp=document.getElementById("splash"); if(sp){ const w=setInterval(()=>{ if(!document.getElementById("splash")||document.getElementById("splash").classList.contains("out")){ clearInterval(w); show(); } },200); } else show(); }
})();
</script>
